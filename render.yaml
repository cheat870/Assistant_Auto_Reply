services:
  - type: web
    name: assistant-auto-reply
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npx prisma db push && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_MODE
        value: polling
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "1667275809"
      - key: AUTO_REPLY_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: assistant-bot-db
          property: connectionString

databases:
  - name: assistant-bot-db
    plan: free
    region: singapore
